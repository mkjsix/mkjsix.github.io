<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 20 680 500" role="img" font-family="Arial, Helvetica, sans-serif">
    <title>Enterprise AI architecture</title>
    <desc>Three-layer diagram: existing systems at the bottom, AI infrastructure in the middle, specialized agents coordinated by an orchestrator at the top.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
    </defs>

    <!-- Layer 1: Existing systems -->
    <rect x="40" y="410" width="600" height="72" rx="6" fill="#F5F5F3" stroke="#C8C8C4" stroke-width="0.5" />
    <text x="60" y="438" dominant-baseline="central" style="font-size:11px;font-weight:500;letter-spacing:0.07em;fill:#888884;font-family:inherit">EXISTING SYSTEMS</text>
    <text x="60" y="462" dominant-baseline="central" style="font-size:12px;fill:#888884;font-family:inherit">ERP · CRM · databases · documents · APIs · legacy</text>

    <!-- Vertical connectors layer 1 → 2 -->
    <line x1="200" y1="410" x2="200" y2="374" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="340" y1="410" x2="340" y2="374" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="480" y1="410" x2="480" y2="374" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arrow)" />

    <!-- Layer 2: AI infrastructure -->
    <rect x="40" y="270" width="600" height="100" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5" />
    <text x="60" y="298" dominant-baseline="central" style="font-size:11px;font-weight:500;letter-spacing:0.07em;fill:#185FA5;font-family:inherit">AI INFRASTRUCTURE</text>
    <text x="60" y="320" dominant-baseline="central" style="font-size:12px;fill:#0C447C;font-family:inherit">Vector search · RAG pipelines · LLM APIs</text>
    <text x="60" y="342" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">Governance · IAM · compliance · audit trail</text>

    <!-- Vertical connector layer 2 → orchestrator -->
    <line x1="340" y1="270" x2="340" y2="234" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" />

    <!-- Orchestrator -->
    <rect x="220" y="168" width="240" height="62" rx="6" fill="#042C53" stroke="#042C53" stroke-width="1" />
    <text x="340" y="193" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#E6F1FB;font-family:inherit">Orchestrator</text>
    <text x="340" y="213" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#85B7EB;font-family:inherit">coordinates · routes · decides</text>

    <!-- Connectors orchestrator → agents -->
    <line x1="220" y1="196" x2="150" y2="148" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="340" y1="168" x2="340" y2="148" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="460" y1="196" x2="530" y2="148" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" />

    <!-- Agent boxes -->
    <rect x="40" y="40" width="178" height="106" rx="6" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5" />
    <text x="129" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C;font-family:inherit">Finance agent</text>
    <text x="129" y="100" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">forecasts, anomalies</text>

    <rect x="251" y="40" width="178" height="106" rx="6" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5" />
    <text x="340" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C;font-family:inherit">Support agent</text>
    <text x="340" y="100" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">tickets, responses</text>

    <rect x="462" y="40" width="178" height="106" rx="6" fill="#ffffff" stroke="#85B7EB" stroke-width="0.5" />
    <text x="551" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C;font-family:inherit">DevOps agent</text>
    <text x="551" y="100" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">infra, incidents</text>

    <!-- Layer labels -->
    <text x="652" y="446" text-anchor="start" dominant-baseline="central" style="font-size:12px;fill:#B4B2A9;font-family:inherit">①</text>
    <text x="652" y="320" text-anchor="start" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">②</text>
    <text x="652" y="93" text-anchor="start" dominant-baseline="central" style="font-size:12px;fill:#185FA5;font-family:inherit">③</text>
</svg>